<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0D1F17"/>
<title>NikkahPure - Verified Halal Marriage</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D1F17;font-family:'Lato',sans-serif;color:#F0E8D5;min-height:100vh}
input,select,textarea,button{font-family:'Lato',sans-serif}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0D1F17}
::-webkit-scrollbar-thumb{background:#1A7A4A;border-radius:3px}
.hover-card{transition:all 0.25s}
.hover-card:hover{background:#163020!important;border-color:#D4A84355!important;box-shadow:0 8px 32px rgba(212,168,67,0.12)!important}
.btn-green{background:linear-gradient(135deg,#22A35F,#1A7A4A);color:#fff;border:none;cursor:pointer;font-family:'Lato',sans-serif;transition:opacity 0.2s}
.btn-gold{background:linear-gradient(135deg,#D4A843,#A07820);color:#0D1F17;border:none;cursor:pointer;font-family:'Lato',sans-serif;transition:opacity 0.2s}
.btn-green:hover,.btn-gold:hover{opacity:0.85}
.btn-outline{background:transparent;color:#F0E8D5;border:1px solid #1E3D2A;cursor:pointer;font-family:'Lato',sans-serif}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadeIn 0.4s ease forwards}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script>
// ── Data ──────────────────────────────────────────────────────
var PROFILES = [
  {id:1,name:"Ibrahim Al-Farouq",age:29,gender:"M",location:"London, UK",sect:"Sunni",madhab:"Hanafi",prayer:"5x daily",ethnicity:"Sudanese",profession:"Architect",education:"MArch",bio:"Seeking a pious, family-oriented wife. I pray on time, attend Jumuah, and value Islamic knowledge. Quiet, thoughtful, and financially stable.",wali:"Dr. Yusuf Al-Farouq (Father)",ini:"IA",col:"#1A7A4A",mutual:false},
  {id:2,name:"Omar Bilal",age:31,gender:"M",location:"Toronto, Canada",sect:"Sunni",madhab:"Maliki",prayer:"5x daily",ethnicity:"Moroccan",profession:"Dentist",education:"DDS",bio:"Alhamdulillah, practising Muslim seeking a compatible God-fearing partner. Looking to build a home grounded in sunnah.",wali:"N/A",ini:"OB",col:"#8B6914",mutual:true},
  {id:3,name:"Tariq Hassan",age:27,gender:"M",location:"Dubai, UAE",sect:"Sunni",madhab:"Shafi'i",prayer:"5x daily",ethnicity:"Egyptian",profession:"Engineer",education:"BSc",bio:"Simple man with strong deen. Family comes first. Looking for a wife who is practising and kind-hearted.",wali:"Ahmed Hassan (Father)",ini:"TH",col:"#C9A84C",mutual:false},
  {id:4,name:"Yusuf Adeyemi",age:33,gender:"M",location:"Chicago, USA",sect:"Sunni",madhab:"Hanbali",prayer:"5x daily",ethnicity:"Nigerian",profession:"Software Engineer",education:"MSc",bio:"Tech professional who does not let deen take a back seat. Regular at the masjid. Looking for someone equally committed.",wali:"Alhaji Musa Adeyemi (Father)",ini:"YA",col:"#2D5A3D",mutual:true},
  {id:5,name:"Amina Hassan",age:26,gender:"F",location:"Birmingham, UK",sect:"Sunni",madhab:"Hanafi",prayer:"5x daily",ethnicity:"Somali",profession:"Software Engineer",education:"MSc",bio:"Alhamdulillah, practising Muslimah seeking a kind God-fearing husband. I value deen above all else.",wali:"Hassan Mohamed (Father)",ini:"AH",col:"#4A7C5E",mutual:false},
  {id:6,name:"Fatima Al-Rashid",age:24,gender:"F",location:"Toronto, Canada",sect:"Sunni",madhab:"Maliki",prayer:"5x daily",ethnicity:"Arab",profession:"Teacher",education:"BA Islamic Studies",bio:"I teach at an Islamic school and am deeply connected to my deen. Seeking a righteous husband with good character.",wali:"Dr. Khalid Al-Rashid (Father)",ini:"FA",col:"#8B6914",mutual:true},
  {id:7,name:"Zainab Malik",age:28,gender:"F",location:"Chicago, USA",sect:"Sunni",madhab:"Hanafi",prayer:"5x daily",ethnicity:"Pakistani",profession:"Doctor",education:"MBBS",bio:"Practising Muslimah balancing career with Islamic values. Looking for a partner who appreciates hard work and strong deen.",wali:"Dr. Tariq Malik (Father)",ini:"ZM",col:"#7B4B8E",mutual:false},
  {id:8,name:"Khadijah Yusuf",age:23,gender:"F",location:"Lagos, Nigeria",sect:"Sunni",madhab:"Maliki",prayer:"5x daily",ethnicity:"Nigerian",profession:"Entrepreneur",education:"BA Business",bio:"Named after the Mother of Believers. Running my own modest fashion brand while pursuing Islamic knowledge.",wali:"Alhaji Yusuf Bello (Father)",ini:"KY",col:"#2D5A3D",mutual:true}
];

var SECTS = ["Sunni","Shia","Ahmadiyya","Ibadi"];
var MADHHABS = ["Hanafi","Maliki","Shafi'i","Hanbali","Ja'fari","Other"];
var PRAYERS = ["5x daily (never miss)","5x mostly regular","Learning and improving"];
var ETHNICITIES = ["Arab","South Asian","African","Southeast Asian","Turkish","European","Other"];
var COUNTRIES = ["United Kingdom","United States","Canada","UAE","Saudi Arabia","Nigeria","Pakistan","Egypt","Malaysia","Other"];

// ── Helpers ───────────────────────────────────────────────────
var e = React.createElement;
var useState = React.useState;

function ce(tag, props) {
  var args = [tag, props];
  for (var i = 2; i < arguments.length; i++) args.push(arguments[i]);
  return React.createElement.apply(React, args);
}

// ── Pattern SVG ───────────────────────────────────────────────
function GeoPat(props) {
  var op = props.op || 0.05;
  return ce("svg", {
    style:{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none",opacity:op},
    viewBox:"0 0 300 300",
    preserveAspectRatio:"xMidYMid slice"
  },
    ce("defs", null,
      ce("pattern", {id:"gp",x:"0",y:"0",width:"60",height:"60",patternUnits:"userSpaceOnUse"},
        ce("circle",{cx:"30",cy:"30",r:"20",fill:"none",stroke:"#D4A843",strokeWidth:"0.5"}),
        ce("circle",{cx:"30",cy:"30",r:"12",fill:"none",stroke:"#D4A843",strokeWidth:"0.3"}),
        ce("line",{x1:"10",y1:"30",x2:"50",y2:"30",stroke:"#D4A843",strokeWidth:"0.3"}),
        ce("line",{x1:"30",y1:"10",x2:"30",y2:"50",stroke:"#D4A843",strokeWidth:"0.3"})
      )
    ),
    ce("rect",{width:"300",height:"300",fill:"url(#gp)"})
  );
}

// ── Avatar ────────────────────────────────────────────────────
function Av(props) {
  var size = props.size || 60;
  return ce("div", {
    style:{
      width:size,height:size,borderRadius:"50%",
      background:props.col+"25",
      border:"2px solid "+props.col+"60",
      display:"flex",alignItems:"center",justifyContent:"center",
      fontSize:Math.floor(size*0.3),fontWeight:700,color:props.col,
      fontFamily:"'Playfair Display',serif",flexShrink:0
    }
  }, props.ini);
}

// ── Badge ─────────────────────────────────────────────────────
function Badge(props) {
  var colors = {
    green:{background:"#22A35F22",border:"1px solid #1A7A4A55",color:"#22A35F"},
    gold:{background:"#D4A84322",border:"1px solid #D4A84355",color:"#E8C97A"},
    muted:{background:"#ffffff08",border:"1px solid #1E3D2A",color:"#4D6B58"}
  };
  var s = colors[props.v] || colors.green;
  return ce("span", {
    style:Object.assign({
      display:"inline-flex",alignItems:"center",gap:4,
      padding:"3px 10px",borderRadius:20,
      fontSize:11,fontWeight:700,letterSpacing:"0.04em"
    }, s)
  }, props.label);
}

// ── Profile Card ──────────────────────────────────────────────
function ProfileCard(props) {
  var p = props.p;
  var expressed = props.expressed;
  var mutual = props.mutual;

  return ce("div", {
    className:"hover-card",
    style:{
      background:"#112318",border:"1px solid #1E3D2A",
      borderRadius:16,padding:20,position:"relative",overflow:"hidden",
      cursor:"pointer"
    }
  },
    ce(GeoPat, {op:0.03}),
    ce("div", {style:{position:"relative"}},
      ce("div", {style:{display:"flex",gap:14,alignItems:"flex-start",marginBottom:14}},
        ce(Av, {ini:p.ini,col:p.col,size:56}),
        ce("div", {style:{flex:1}},
          ce("div", {style:{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,color:"#F0E8D5",marginBottom:3}}, p.name),
          ce("div", {style:{fontSize:12,color:"#8FAF9A",marginBottom:6}}, "📍 "+p.location+" · "+p.age+" yrs"),
          ce("div", {style:{display:"flex",gap:6,flexWrap:"wrap"}},
            ce(Badge, {label:"✓ VERIFIED",v:"green"}),
            mutual && ce(Badge, {label:"💚 Mutual",v:"green"})
          )
        )
      ),
      ce("div", {style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}},
        [{l:"Sect",v:p.sect},{l:"Madhab",v:p.madhab},{l:"Prayer",v:p.prayer},{l:"From",v:p.ethnicity}].map(function(f) {
          return ce("div", {key:f.l,style:{background:"#1C3A28",borderRadius:8,padding:"7px 10px",border:"1px solid #1E3D2A"}},
            ce("div", {style:{fontSize:10,color:"#4D6B58",fontWeight:700,marginBottom:2}}, f.l.toUpperCase()),
            ce("div", {style:{fontSize:12,color:"#F0E8D5",fontWeight:600}}, f.v)
          );
        })
      ),
      ce("p", {style:{fontSize:12,color:"#8FAF9A",lineHeight:1.7,margin:"0 0 12px"}},
        p.bio.slice(0,100)+"..."
      ),
      ce("div", {style:{display:"flex",gap:8}},
        ce("button", {
          className:"btn-green",
          onClick:function(){props.onView(p);},
          style:{flex:1,padding:"9px 0",borderRadius:9,fontWeight:700,fontSize:12}
        }, "View Profile"),
        ce("button", {
          onClick:function(){props.onInterest(p.id);},
          style:{
            width:38,height:38,borderRadius:9,flexShrink:0,
            background:expressed?"#E0505018":"#1C3A28",
            border:"1px solid "+(expressed?"#E0505055":"#1E3D2A"),
            cursor:"pointer",fontSize:16
          }
        }, expressed?"❤️":"🤍")
      )
    )
  );
}

// ── Profile Modal ─────────────────────────────────────────────
function ProfileModal(props) {
  var p = props.p;
  var expressed = props.expressed;

  return ce("div", {
    onClick:function(ev){if(ev.target===ev.currentTarget)props.onClose();},
    style:{
      position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",
      zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",
      padding:20,backdropFilter:"blur(6px)"
    }
  },
    ce("div", {
      style:{
        background:"#112318",borderRadius:20,maxWidth:520,width:"100%",
        maxHeight:"90vh",overflowY:"auto",
        border:"1px solid #D4A84333",
        boxShadow:"0 32px 80px rgba(0,0,0,0.6)"
      }
    },
      ce("div", {
        style:{
          background:"linear-gradient(150deg,#163020,#0D1F17)",
          padding:"28px 24px 20px",borderRadius:"20px 20px 0 0",
          position:"relative",overflow:"hidden"
        }
      },
        ce(GeoPat,{op:0.06}),
        ce("button", {
          onClick:props.onClose,
          style:{
            position:"absolute",top:14,right:14,width:32,height:32,
            borderRadius:8,background:"#1C3A28",border:"1px solid #1E3D2A",
            cursor:"pointer",fontSize:18,color:"#4D6B58",
            display:"flex",alignItems:"center",justifyContent:"center"
          }
        },"✕"),
        ce("div", {style:{display:"flex",gap:18,alignItems:"center",position:"relative"}},
          ce(Av,{ini:p.ini,col:p.col,size:80}),
          ce("div", null,
            ce("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:700,color:"#F0E8D5"}},p.name),
            ce("div",{style:{color:"#8FAF9A",fontSize:13,marginTop:4}},"📍 "+p.location+" · "+p.age+" years old"),
            ce("div",{style:{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}},
              ce(Badge,{label:"✓ VERIFIED",v:"green"}),
              ce(Badge,{label:p.gender==="M"?"🕌 Brother":"🌸 Sister",v:"gold"})
            )
          )
        )
      ),
      ce("div",{style:{padding:"20px 24px 24px",display:"flex",flexDirection:"column",gap:16}},
        ce("div",{style:{background:"#22A35F22",border:"1px solid #1A7A4A44",borderRadius:12,padding:"12px 14px"}},
          ce("div",{style:{fontWeight:700,fontSize:13,color:"#22A35F",marginBottom:6}},"🛡️ Identity Verified"),
          ce("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
            ce(Badge,{label:"✓ Govt ID",v:"green"}),
            ce(Badge,{label:"✓ Face Match",v:"green"}),
            ce(Badge,{label:"✓ Phone & Email",v:"green"})
          )
        ),
        ce("div",null,
          ce("div",{style:{fontSize:11,fontWeight:700,color:"#D4A843",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:8}},"About"),
          ce("p",{style:{fontSize:13,color:"#8FAF9A",lineHeight:1.8,margin:0}},p.bio)
        ),
        ce("div",null,
          ce("div",{style:{fontSize:11,fontWeight:700,color:"#D4A843",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:10}},"Islamic Profile"),
          ce("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
            [{l:"Sect",v:p.sect},{l:"Madhab",v:p.madhab},{l:"Prayer",v:p.prayer},{l:"Ethnicity",v:p.ethnicity},{l:"Education",v:p.education},{l:"Profession",v:p.profession}].map(function(f){
              return ce("div",{key:f.l,style:{background:"#1C3A28",borderRadius:10,padding:"10px 12px",border:"1px solid #1E3D2A"}},
                ce("div",{style:{fontSize:10,color:"#4D6B58",fontWeight:700,marginBottom:3}},f.l.toUpperCase()),
                ce("div",{style:{fontSize:13,color:"#F0E8D5",fontWeight:600}},f.v)
              );
            })
          )
        ),
        ce("div",{style:{background:"#1C3A28",border:"1px solid #D4A84333",borderRadius:12,padding:"12px 14px"}},
          ce("div",{style:{fontWeight:700,fontSize:13,color:"#D4A843",marginBottom:4}},"🛡️ Wali / Guardian"),
          ce("div",{style:{fontSize:13,color:"#8FAF9A"}},p.wali),
          ce("div",{style:{fontSize:12,color:"#4D6B58",marginTop:4}},"Contact facilitated through our Wali Liaison after mutual interest confirmed.")
        ),
        ce("div",{style:{background:"#D4A84309",border:"1px solid #D4A84333",borderRadius:12,padding:"12px 14px",fontSize:12,color:"#4D6B58",lineHeight:1.6}},
          "🔒 ",ce("strong",{style:{color:"#E8C97A"}},"Mutual Interest Required.")," Messages unlock only after both parties express interest."
        ),
        ce("button",{
          onClick:function(){props.onInterest(p.id);},
          style:{
            padding:"13px 0",borderRadius:12,width:"100%",
            background:expressed?"#C9404020":"linear-gradient(135deg,#D4A843,#A07820)",
            color:expressed?"#E05050":"#0D1F17",
            border:expressed?"1px solid #E0505044":"none",
            fontWeight:700,fontSize:14,cursor:"pointer",
            fontFamily:"'Lato',sans-serif"
          }
        }, expressed?"💔 Withdraw Interest":"💛 Express Interest")
      )
    )
  );
}

// ── Onboarding ────────────────────────────────────────────────
function Onboarding(props) {
  var stateStep = useState(0);
  var step = stateStep[0]; var setStep = stateStep[1];
  var stateVer = useState(0);
  var verStep = stateVer[0]; var setVerStep = stateVer[1];
  var stateForm = useState({gender:"",name:"",email:"",phone:"",country:"",sect:"",madhab:"",prayer:"",ethnicity:"",dob:"",wali:"",bio:""});
  var form = stateForm[0]; var setForm = stateForm[1];

  function set(k,v){setForm(function(p){var n=Object.assign({},p);n[k]=v;return n;});}

  var STEPS = ["Account","Verify","Islamic","Photo","Done"];

  function StepBar() {
    return ce("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:24,position:"relative"}},
      ce("div",{style:{position:"absolute",top:14,left:"10%",right:"10%",height:1,background:"#1E3D2A"}}),
      ce("div",{style:{position:"absolute",top:14,left:"10%",width:(step/4*80)+"%",height:1,background:"#22A35F",transition:"width 0.4s"}}),
      STEPS.map(function(_,i){
        return ce("div",{key:i,style:{display:"flex",flexDirection:"column",alignItems:"center",gap:5,zIndex:1}},
          ce("div",{style:{
            width:28,height:28,borderRadius:"50%",
            background:i<step?"#22A35F":i===step?"#D4A843":"#1C3A28",
            border:"2px solid "+(i<step?"#22A35F":i===step?"#D4A843":"#1E3D2A"),
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:11,fontWeight:700,
            color:i<step||i===step?"#0D1F17":"#4D6B58",
            transition:"all 0.3s"
          }}, i<step?"✓":String(i+1)),
          ce("div",{style:{fontSize:9,color:i===step?"#D4A843":"#4D6B58",fontWeight:600,whiteSpace:"nowrap"}},STEPS[i])
        );
      })
    );
  }

  function InpField(p) {
    return ce("div",{style:{display:"flex",flexDirection:"column",gap:6}},
      p.label && ce("label",{style:{fontSize:11,fontWeight:700,color:"#4D6B58",letterSpacing:"0.1em",textTransform:"uppercase"}},p.label),
      ce("input",{type:p.type||"text",value:p.value,onChange:p.onChange,placeholder:p.placeholder,style:{padding:"12px 14px",borderRadius:10,background:"#1C3A28",border:"1px solid #1E3D2A",color:"#F0E8D5",fontSize:14,outline:"none",width:"100%"}}),
      p.hint && ce("span",{style:{fontSize:11,color:"#4D6B58"}},p.hint)
    );
  }

  function SelField(p) {
    return ce("div",{style:{display:"flex",flexDirection:"column",gap:6}},
      p.label && ce("label",{style:{fontSize:11,fontWeight:700,color:"#4D6B58",letterSpacing:"0.1em",textTransform:"uppercase"}},p.label),
      ce("select",{value:p.value,onChange:p.onChange,style:{padding:"12px 14px",borderRadius:10,background:"#1C3A28",border:"1px solid #1E3D2A",color:"#F0E8D5",fontSize:14,outline:"none",cursor:"pointer"}},
        ce("option",{value:""},"Select..."),
        p.options.map(function(o){return ce("option",{key:o,value:o,style:{background:"#1C3A28"}},o);})
      )
    );
  }

  return ce("div",{
    style:{minHeight:"100vh",background:"#0D1F17",display:"flex",alignItems:"center",justifyContent:"center",padding:20,position:"relative",overflow:"hidden"}
  },
    ce(GeoPat,{op:0.04}),
    ce("div",{style:{maxWidth:480,width:"100%",position:"relative",zIndex:1},className:"fadein"},
      ce("div",{style:{textAlign:"center",marginBottom:24}},
        ce("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:30,fontWeight:900,color:"#F0E8D5",lineHeight:1}},"NikkahPure"),
        ce("div",{style:{fontSize:10,color:"#D4A843",letterSpacing:"0.2em",fontWeight:600,marginTop:4}},"VERIFIED · HALAL · TRUSTED")
      ),
      ce(StepBar,null),
      ce("div",{style:{background:"#112318",border:"1px solid #1E3D2A",borderRadius:20,padding:24,position:"relative",overflow:"hidden"}},
        ce(GeoPat,{op:0.03}),
        ce("div",{style:{position:"relative"}},

          step===0 && ce("div",{style:{display:"flex",flexDirection:"column",gap:14}},
            ce("div",null,
              ce("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:22,color:"#F0E8D5",marginBottom:4}},"Create Account"),
              ce("div",{style:{fontSize:13,color:"#4D6B58"}},"Start your halal journey honestly")
            ),
            ce("div",{style:{display:"flex",gap:10}},
              ["M","F"].map(function(g){
                return ce("button",{
                  key:g,
                  onClick:function(){set("gender",g);},
                  style:{
                    flex:1,padding:"11px 0",borderRadius:10,
                    background:form.gender===g?(g==="M"?"#22A35F22":"#D4A84322"):"#1C3A28",
                    border:"1px solid "+(form.gender===g?(g==="M"?"#1A7A4A":"#D4A843"):"#1E3D2A"),
                    color:form.gender===g?(g==="M"?"#22A35F":"#D4A843"):"#4D6B58",
                    fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"'Lato',sans-serif"
                  }
                }, g==="M"?"🕌 Brother":"🌸 Sister");
              })
            ),
            ce(InpField,{label:"Full Name (as on ID)",placeholder:"Your legal name",value:form.name,onChange:function(e){set("name",e.target.value);}}),
            ce(InpField,{label:"Email",type:"email",placeholder:"your@email.com",value:form.email,onChange:function(e){set("email",e.target.value);}}),
            ce(InpField,{label:"Phone",type:"tel",placeholder:"+44 7700 000000",value:form.phone,onChange:function(e){set("phone",e.target.value);}}),
            ce(SelField,{label:"Country",options:COUNTRIES,value:form.country,onChange:function(e){set("country",e.target.value);}}),
            ce(InpField,{label:"Date of Birth",type:"date",value:form.dob,onChange:function(e){set("dob",e.target.value);},hint:"Must be 18+. Verified against your ID."}),
            ce("div",{style:{background:"#D4A84309",border:"1px solid #D4A84333",borderRadius:10,padding:"10px 12px",fontSize:12,color:"#4D6B58",lineHeight:1.6}},
              "🔒 Your data is encrypted and never sold."
            ),
            ce("button",{className:"btn-gold",onClick:function(){setStep(1);},style:{padding:"13px 0",borderRadius:12,fontWeight:700,fontSize:14,width:"100%"}},"Continue →")
          ),

          step===1 && ce("div",{style:{display:"flex",flexDirection:"column",gap:14}},
            ce("div",null,
              ce("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:22,color:"#F0E8D5",marginBottom:4}},"Identity Verification"),
              ce("div",{style:{fontSize:13,color:"#4D6B58"}},"Zero tolerance for fake profiles.")
            ),
            [
              {title:"Government ID Upload",desc:"Upload passport or national ID. We verify name, age, and photo.",icon:"🪪"},
              {title:"Live Selfie - Face Match",desc:"Real-time selfie confirms you match your ID photo.",icon:"🤳"},
              {title:"Phone and Email OTP",desc:"One-time codes sent to confirm ownership.",icon:"📱"}
            ].map(function(s,i){
              var done = verStep > i;
              var active = verStep === i;
              return ce("div",{key:i,style:{display:"flex",gap:12,alignItems:"flex-start",padding:14,borderRadius:12,background:done?"#22A35F22":active?"#1C3A28":"#112318",border:"1px solid "+(done?"#1A7A4A44":"#1E3D2A")}},

function App() {
  var statePage = useState("landing");
  var page = statePage[0]; var setPage = statePage[1];
  if(page==="landing") return ce(Landing,{onStart:function(){setPage("onboarding");}});
  if(page==="onboarding") return ce(Onboarding,{onFinish:function(){setPage("app");}});
  return ce(MainApp,null);
}

var root = ReactDOM.createRoot(container);
root.render(ce(App,null));
